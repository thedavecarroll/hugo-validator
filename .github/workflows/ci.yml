name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # Mondays 06:00 UTC. Catches a new Hugo, Node or browser release that
    # breaks the pipeline even when nothing in this repo changed.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 24 is the supported minimum line. "latest" warns before a future Node breaks something.
        node: ['24', 'latest']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install the latest Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - run: hugo version

      - run: npm ci

      - name: Install the browser for this Playwright version
        run: npx --no playwright install --with-deps chromium

      - name: Type check and unit tests
        run: npm test

      - name: End-to-end tests against the sample site
        run: npm run test:e2e

  tag-matches-version:
    name: Tag matches package.json version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare the tag with package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json"
